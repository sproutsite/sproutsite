name: Sproutsite

url: https://sproutsite.dev

base: /

i18n:
    locale: en
    defaultLocale: en
    locales:
        - en
        - de

branding:
    logo:
        src: /branding/logo.svg
        srcOnDark: /branding/logo-light.svg
        width: 40
        height: 40
        showName: true
    footerLogo:
        src: /branding/logo.svg
        srcOnDark: /branding/logo-light.svg
        width: 48
        height: 48
        showName: true
    icons:
        favicon: /branding/favicon.svg
        shortcut: /branding/favicon.ico
        appleTouch: /branding/apple-touch-icon.png
        app192: /branding/icon-192.png
        app512: /branding/icon-512.png
    sharingImage:
        src: /branding/sharing-image.png
        alt: Sproutsite — The Agent-first Static CMS

colors:
    surfaces:
        default: '#ffffff'
        muted: '#f5f7fa'
        border: '#e2e8f0'
        text: '#0b1f3a'
    primary:
        color: '#134b70'
        content: '#ffffff'
    secondary:
        color: '#0f766e'
        content: '#ffffff'
    accent:
        color: '#b45309'
        content: '#ffffff'
    neutral:
        color: '#26334a'
        content: '#ffffff'
    info:
        color: '#1769aa'
        content: '#ffffff'
    success:
        color: '#19764b'
        content: '#ffffff'
    warning:
        color: '#9a5b00'
        content: '#ffffff'
    error:
        color: '#b42318'
        content: '#ffffff'
    brand:
        background: '#071a36'
        backgroundEnd: '#0d2b50'
        gradient: '#125b86'
        content: '#ffffff'
        highlight: '#70c6df'
        accent: '#74e33d'

typography:
    headings:
        family: serif
        weight: 500
    eyebrow:
        family: serif
        weight: 500

hero:
    classes:
        - ss-hero--theme-1
    background-image: /backgrounds/hero-waves.svg

links:
    external:
        newTab: true
        icon: true

header:
    links:
        - label: Home
          href: /
        - label: Showcase
          href: /showcase/
        - label: Documentation
          href: /documentation/
        - label: Blog
          href: /blog/
        - type: separator
        - type: language-switcher
        - type: cta
          icon: Mail
          variant: primary
          label: Contact
          href: /contact/

footer:
    text: Agent-first Static CMS for Astro and TypeScript.
    copyright: © 2026 Sproutsite
    showVersion: true
    languageSwitcher: true
    groups:
        - title: Product
          links:
              - label: Documentation
                href: /documentation/
                icon: BookOpen
              - label: FAQ
                href: /faq/
                icon: CircleQuestionMark
              - label: Contact
                href: /contact/
                icon: Mail
        - title: Project
          links:
              - label: About Sproutsite
                href: /info/
                icon: Sprout
              - label: GitHub
                href: https://github.com/sproutsite/sproutsite
                icon: CodeXml
              - label: Changelog
                href: https://github.com/sproutsite/sproutsite/blob/main/CHANGELOG.md
                icon: Layers
    social:
        title: Follow
        links:
            - platform: github
              label: Sproutsite on GitHub
              href: https://github.com/sproutsite/sproutsite
            - platform: instagram
              label: Sproutsite on Instagram
              href: https://www.instagram.com/sproutsite
            - platform: facebook
              label: Sproutsite on Facebook
              href: https://www.facebook.com/sproutsite
    links:
        - label: Legal notice
          href: /legal-notice/
        - label: Privacy
          href: /privacy-policy/
        - label: Security checks
          href: /documentation/deployment/#06-security-checks-https-and-security-headers

blog:
    hero:
        title: Blog
        eyebrow: Project journal
        description: Project updates, decisions, and milestones in building Sproutsite, an agent-first, Markdown-first static CMS.
    articles:
        heading: Sproutsite development journal
