name: __SITE_NAME_YAML__
url: https://example.com
base: /
i18n:
    locale: en
    defaultLocale: en
    locales: [en]
branding:
    logo:
        src: /branding/logo.svg
        width: 40
        height: 40
        showName: true
    icons:
        favicon: /branding/favicon.svg
        shortcut: /branding/favicon.ico
        appleTouch: /branding/apple-touch-icon.png
        app192: /branding/icon-192.png
        app512: /branding/icon-512.png
    sharingImage:
        src: /branding/sharing-image.png
        alt: Website preview
hero:
    classes:
        - ss-hero--starter-waves
    background-image: /images/hero.jpg
links:
    external:
        newTab: true
        icon: true
search:
    enabled: false
header:
    links:
        - label: Home
          href: /
footer:
    background-image: /images/footer.webp
    text: Notes, updates, and ideas from our team.
    links:
        - label: Home
          href: /
